name: Deploy Malcolm Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy malcolmai-live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare credentials
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing repository secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Deploy Worker to workers.dev
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.106.0 deploy --config wrangler.workersdev.toml

      - name: Sync plugin Bearer secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MALCOLM_INFINITY_API_TOKEN: ${{ secrets.MALCOLM_INFINITY_API_TOKEN }}
        run: |
          if [ -z "$MALCOLM_INFINITY_API_TOKEN" ]; then
            echo "MALCOLM_INFINITY_API_TOKEN is not in repository secrets. Worker secret already set in Cloudflare is left unchanged."
            exit 0
          fi
          printf '%s' "$MALCOLM_INFINITY_API_TOKEN" | npx --yes wrangler@4.106.0 secret put MALCOLM_INFINITY_API_TOKEN --config wrangler.workersdev.toml
          echo "Plugin Bearer secret synced. Value not printed."
